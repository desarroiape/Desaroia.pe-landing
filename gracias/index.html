<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/brand_assets/brand_assets_nuevo/DesarroIA-brand/logos/favicon.svg">
  <link rel="icon" type="image/png" href="/brand_assets/brand_assets_nuevo/DesarroIA-brand/logos/favicon.png">
  <script>
    try { if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --surface-0: #ffffff; --surface-1: #f4f4f5; --ink: #0b0b0c; --ink-muted: #5b5b63; --line: #e4e4e7; --line-strong: #8a8a93;
      --accent: #2b44ff; --accent-strong: #1f33d6; --accent-text: #2b44ff; --accent-tint: #eef1ff; --on-accent: #ffffff;
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --surface-0: #0b0b0c; --surface-1: #16161a; --ink: #f5f5f7; --ink-muted: #a1a1aa; --line: #2a2a31; --line-strong: #6b6b75;
      --accent: #7c8cff; --accent-strong: #a3aeff; --accent-text: #7c8cff; --accent-tint: #1a1f45; --on-accent: #0b0b0c;
      color-scheme: dark;
    }
    body {
      min-height: 100vh; display: flex; flex-direction: column;
      background: var(--surface-1); color: var(--ink);
      font-family: "Inter", system-ui, sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased;
    }
    header { padding: 24px 32px; }
    header img { height: 30px; width: auto; display: block; }
    .logo-negro { display: block; } .logo-blanco { display: none; }
    :root[data-theme="dark"] .logo-negro { display: none; }
    :root[data-theme="dark"] .logo-blanco { display: block; }
    main { flex: 1; display: grid; place-items: center; padding: 24px 20px 64px; }
    .card {
      width: 100%; max-width: 560px; text-align: center;
      background: var(--surface-0); border: 1px solid var(--line); border-radius: 20px;
      padding: 56px 40px 44px;
      box-shadow: 0 1px 2px rgba(11, 11, 12, 0.04), 0 30px 60px -36px rgba(43, 68, 255, 0.35);
    }
    .check {
      width: 64px; height: 64px; margin: 0 auto 28px; border-radius: 50%;
      display: grid; place-items: center; background: var(--accent-tint); color: var(--accent-text);
      animation: pop 0.6s var(--spring) both;
    }
    @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: none; opacity: 1; } }
    .eyebrow { font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted); }
    h1 { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: clamp(30px, 5vw, 40px); line-height: 1.1; letter-spacing: -0.025em; margin-top: 12px; }
    h1 span { color: var(--accent-text); }
    p.lead { color: var(--ink-muted); font-size: 1rem; line-height: 1.7; margin: 16px auto 0; max-width: 420px; }
    .actions { display: flex; flex-direction: column; gap: 12px; margin-top: 32px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font: 600 0.92rem "Inter", sans-serif; text-decoration: none;
      padding: 14px 24px; border-radius: 12px; cursor: pointer;
      transition: transform 0.25s var(--spring), background-color 0.2s ease, border-color 0.2s ease;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: scale(0.98); }
    .btn:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 3px; }
    .btn-primary { background: var(--accent); color: var(--on-accent); }
    .btn-primary:hover { background: var(--accent-strong); }
    .btn-ghost { border: 1px solid var(--line-strong); color: var(--ink); font-weight: 500; }
    .btn-ghost:hover { border-color: var(--ink); background: var(--surface-1); }
    @media (max-width: 560px) { header { padding: 20px; } .card { padding: 44px 22px 28px; } }
    @media (prefers-reduced-motion: reduce) { .check { animation: none; } .btn { transition: none; } }
  </style>
</head>
<body>
  <header>
    <a href="/" aria-label="DesarroIA, ir al inicio">
      <img class="logo-negro" src="/brand_assets/brand_assets_nuevo/DesarroIA-brand/logos/desarroia-logo-horizontal-negro.svg" alt="DesarroIA" width="132" height="30">
      <img class="logo-blanco" src="/brand_assets/brand_assets_nuevo/DesarroIA-brand/logos/desarroia-logo-horizontal-blanco.svg" alt="" width="132" height="30">
    </a>
  </header>
  <main>
    <div class="card">
      <div class="check" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="eyebrow">Mensaje enviado</div>
      <h1>¡Gracias! Ya <span>recibimos</span> tu mensaje</h1>
      <p class="lead">Lo revisamos y te escribimos pronto al correo que nos dejaste. Si prefieres avanzar ahora, escríbenos por WhatsApp.</p>
      <div class="actions">
        <a class="btn btn-primary" href="https://wa.me/51925593376?text=Hola%2C%20acabo%20de%20dejar%20un%20mensaje%20en%20la%20web%20de%20DesarroIA" target="_blank" rel="noopener">
          Escribir por WhatsApp
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <a class="btn btn-ghost" href="/">Volver al inicio</a>
      </div>
    </div>
  </main>
</body>
</html>
